name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a preinstalled Android SDK with
      # ANDROID_SDK_ROOT set and licenses already accepted, and AGP will
      # auto-download any specific platform/build-tools version it's
      # still missing, so no manual sdkmanager step is needed here.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: s1toolkit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Lint-check python client
        run: |
          python3 -m py_compile python/ola.py
